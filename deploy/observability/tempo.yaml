# Somewhere for the traces to land.
#
# One process, local disk, two days: a fixture, not a deployment. What it has to be right
# about is the receiver — Keydra exports OTLP over gRPC on 4317, which is what the endpoint
# in KEYDRA_OTLP_ENDPOINT points at.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Short, so a trace shows up in the interface while somebody is still looking for it.
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Without this, Grafana's Traces Drilldown opens on an error: its rate, error and duration
# panels are TraceQL metrics queries, and those are answered by the metrics generator
# rather than by the traces themselves ("error finding generators: empty ring"). The traces
# are there either way — the panels above them are not.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      # Rate and duration per endpoint, written where the rest of the numbers already are.
      # Prometheus is started with --web.enable-remote-write-receiver for this one thing.
      - url: http://localhost:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      flush_to_storage: true

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, span-metrics, service-graphs]
      generate_native_histograms: both

stream_over_http_enabled: true
